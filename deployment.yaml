# Use Kubernetes' Deployment API. A Deployment creates and manages Pods for us.
apiVersion: apps/v1
kind: Deployment
metadata:
  # This is the name used by commands such as `kubectl get deployment`.
  name: nexusproxy-deployment
spec:
  # Keep one copy of the application running.
  replicas: 1

  # The Deployment manages Pods carrying this exact label.
  selector:
    matchLabels:
      app: nexusproxy

  # This template describes every Pod created by the Deployment.
  template:
    metadata:
      labels:
        # This must match spec.selector.matchLabels above.
        app: nexusproxy
    spec:
      containers:
        - name: nexusproxy-container
          # This tag must match the image built and loaded into Minikube.
          image: nexusproxy:1.0.0
          # Use the image loaded into Minikube instead of pulling from a registry.
          imagePullPolicy: IfNotPresent

      # Deployments always restart completed containers. Because this program
      # prints once and exits, Kubernetes will start it again repeatedly.
      restartPolicy: Always
